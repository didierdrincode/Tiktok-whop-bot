name: tiktok-drip

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      runtime:
        default: "15"

concurrency:
  group: tiktok-drip
  cancel-in-progress: false

jobs:
  drip:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Allows running up to the maximum 6-hour GitHub Actions job limit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - uses: actions/cache@v4
        with:
          path: |
            state.json
            free-proxy-list.txt
            working-proxies.txt
            proxy-geo.json
          key: botdata-${{ github.run_id }}
          restore-keys: botdata-

      - run: pip install -r requirements.txt

      - name: Ensure proxies & run continuous bot loop
        run: |
          # Set runtime variable from input or default
          RUNTIME="${{ github.event.inputs.runtime || 15 }}"
          
          # Infinite loop within the 6-hour job window to keep harvesting and running
          while true; do
            echo "[*] Starting proxy assurance cycle..."
            python ensure_proxies.py --min 50 --max-wait 10
            
            echo "[*] Running host diagnostics..."
            python tiktok_bot.py --test-hosts || true
            
            echo "[*] Executing view generation slice for ${RUNTIME} minutes..."
            python tiktok_bot.py --runtime "$RUNTIME" --residential-only --debug || true
            
            echo "[*] Slice finished. Looping back to harvest fresh proxies and continue..."
            sleep 5
          done