name: tiktok-drip

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      runtime:
        default: "15"

concurrency:
  group: tiktok-drip
  cancel-in-progress: false

jobs:
  drip:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - uses: actions/cache@v4
        with:
          path: |
            state.json
            free-proxy-list.txt
            working-proxies.txt
            proxy-geo.json
          key: botdata-${{ github.run_id }}
          restore-keys: botdata-

      - run: pip install -r requirements.txt

      - name: Ensure proxies (loops until enough)
        run: python ensure_proxies.py --min 40 --max-wait 10

      - name: Host diagnostics
        run: python tiktok_bot.py --test-hosts

      - name: Run slice
        run: python tiktok_bot.py --runtime ${{ github.event.inputs.runtime || 15 }} --residential-only --debug